[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dev"
version = "0.1.0"
description = "桌面 AI 智能助手 — 支持多模型、记忆、文档分类、日程管理"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
